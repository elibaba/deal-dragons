[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-dragons"
version = "1.0.0"
description = "Deal Dragons: a Dragons' Den-style multi-agent Deal Review Board for PSO Security SOWs, built on Google ADK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "google-adk[db,gcp]==2.14.1",
  "google-cloud-secret-manager>=2.20",
  "google-cloud-dlp>=3.20",
  "google-cloud-modelarmor>=0.2",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-gcp-trace>=1.9",
  "aiosqlite>=0.20",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "google-adk[eval]==2.14.1"]

[tool.setuptools.packages.find]
include = ["deal_dragons*"]

[tool.setuptools.package-data]
deal_dragons = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP042"]
